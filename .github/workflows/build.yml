name: Build mod
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip uploaded source
        run: |
          if [ ! -d app/src/main/jni ]; then
            unzip -q ./*.zip -d /tmp/src
            cp -r /tmp/src/*/. .
          fi
          ls app/src/main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build libOctober.so
        run: |
          cd app/src/main/jni
          $ANDROID_NDK_LATEST_HOME/ndk-build -j4
          mkdir -p $GITHUB_WORKSPACE/out
          find .. -name libOctober.so -path '*arm64-v8a*' -exec cp {} $GITHUB_WORKSPACE/out/ \;
      - name: Build classes2.dex
        run: |
          JAR=$ANDROID_HOME/platforms/android-30/android.jar
          [ -f "$JAR" ] || JAR=$(ls $ANDROID_HOME/platforms/*/android.jar | tail -1)
          D8=$(ls -d $ANDROID_HOME/build-tools/*/ | tail -1)d8
          mkdir -p out/classes
          javac -bootclasspath "$JAR" -source 8 -target 8 -d out/classes \
            app/src/main/java/com/unity3d/player/CustomFileChooser.java \
            app/src/main/java/com/unity3d/player/FileSelector.java
          jar cf out/filepicker.jar -C out/classes .
          $D8 --lib "$JAR" --output out out/filepicker.jar
          mv out/classes.dex out/classes2.dex
      - uses: actions/upload-artifact@v4
        with:
          name: mod-files
          path: |
            out/libOctober.so
            out/classes2.dex
